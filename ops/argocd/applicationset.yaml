# ssa1004 portfolio — 10 service GitOps 통합 배포.
#
# ArgoCD ApplicationSet 하나가 10 개의 Application 을 동시에 생성한다.
# 각 service 는 자신의 repo 에 들어있는 Helm chart 를 source 로 사용한다.
#
# 적용:
#   kubectl apply -f ops/argocd/projects.yaml
#   kubectl apply -f ops/argocd/applicationset.yaml
#
# 주의:
#   - 10 service 모두 helm/<chart-name>/ 위치 (예외 없음).
#   - dev / prod 분기는 applicationset-dev.yaml / applicationset-prod.yaml 참고.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ssa1004-portfolio
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: auth-service
            repo: auth-service
            path: helm/auth-service
          - name: security-log-search
            repo: security-log-search
            path: helm/security-log-search
          - name: notification-hub
            repo: notification-hub
            path: helm/notification-hub
          - name: search-service
            repo: search-service
            path: helm/search-service
          - name: billing-platform
            repo: billing-platform
            path: helm/billing-platform
          - name: resell-orderbook
            repo: bid-ask-marketplace
            path: helm/resell-orderbook
          - name: gpu-job-orchestrator
            repo: gpu-job-orchestrator
            path: helm/gpu-job-orchestrator
          - name: mini-shop
            repo: commerce-ops
            path: helm/mini-shop
          - name: realtime-feed-service
            repo: realtime-feed-service
            path: helm/realtime-feed-service
          - name: graphql-gateway
            repo: graphql-gateway
            path: helm/graphql-gateway
  template:
    metadata:
      name: '{{name}}'
      labels:
        app.kubernetes.io/name: '{{name}}'
        app.kubernetes.io/part-of: ssa1004-portfolio
    spec:
      project: ssa1004-portfolio
      source:
        repoURL: https://github.com/ssa1004/{{repo}}.git
        targetRevision: HEAD
        path: '{{path}}'
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
