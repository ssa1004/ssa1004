# ssa1004 portfolio — dev 환경 ApplicationSet.
#
# applicationset.yaml 과 동일한 구조이지만 namespace 에 `-dev` suffix 가 붙고
# valueFiles 에 values-dev.yaml override 가 추가된다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ssa1004-portfolio-dev
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: auth-service
            repo: auth-service
            path: helm/auth-service
          - name: security-log-search
            repo: security-log-search
            path: helm/security-log-search
          - name: notification-hub
            repo: notification-hub
            path: helm/notification-hub
          - name: search-service
            repo: search-service
            path: helm/search-service
          - name: billing-platform
            repo: billing-platform
            path: helm/billing-platform
          - name: resell-orderbook
            repo: resell-orderbook
            path: helm/resell-orderbook
          - name: gpu-job-orchestrator
            repo: gpu-job-orchestrator
            path: helm/gpu-job-orchestrator
          - name: mini-shop
            repo: commerce-ops
            path: helm/mini-shop
          - name: realtime-feed-service
            repo: realtime-feed-service
            path: helm/realtime-feed-service
  template:
    metadata:
      name: '{{name}}-dev'
      labels:
        app.kubernetes.io/name: '{{name}}'
        app.kubernetes.io/part-of: ssa1004-portfolio
        env: dev
    spec:
      project: ssa1004-portfolio
      source:
        repoURL: https://github.com/ssa1004/{{repo}}.git
        targetRevision: HEAD
        path: '{{path}}'
        helm:
          releaseName: '{{name}}'
          valueFiles:
            - values.yaml
            - values-dev.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{name}}-dev'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
